name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11.13
        uses: actions/setup-python@v5
        with:
          # Pinned to the same version AGENTS.md mandates for local dev so CI
          # runs the same interpreter contributors test against.
          python-version: "3.11.13"
          cache: pip

      - name: Install runtime + test deps
        # Runtime: argit's only declared dep is click>=8.1 (pyproject.toml).
        # Test: pytest. Stdlib covers everything else for the unit tier.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "click>=8.1" pytest

      - name: Run unit tests
        # PYTHONPATH=src lets argit import without `pip install -e .` —
        # mirrors the local-dev invocation in AGENTS.md.
        run: PYTHONPATH=src python -m pytest tests/unit/

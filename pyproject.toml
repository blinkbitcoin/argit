[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argit"
version = "1.0.0"
description = "Per-user agent backup/restore CLI (OpenClaw MVP)"
requires-python = ">=3.10"
authors = [{ name = "Blink", email = "engineering@blinkbtc.com" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
  "click>=8.1",
]

[project.scripts]
argit = "argit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argit = [
  "manifest_templates/*.json",
  "keys/*.asc",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
